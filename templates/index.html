<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Consultation Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <!-- Chat Card Container -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl flex flex-col h-[650px] overflow-hidden border border-slate-200">
        
        <!-- Branded Header with Provided Logo -->
        <div class="bg-slate-900 text-white p-4 flex items-center justify-between border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <img src="https://cdn.phototourl.com/member/2026-09-27-096cc194-f699-4ff4-9178-d37994399265.png" 
                         alt="Official Logo" 
                         class="w-11 h-11 rounded-full object-cover border-2 border-emerald-400 bg-white shadow">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h2 class="text-base font-semibold leading-tight">Official Client Support</h2>
                    <p class="text-xs text-slate-400 flex items-center gap-1">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        AI Verified Assistant &bull; Online
                    </p>
                </div>
            </div>
            <a href="/leads" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 py-1.5 px-3 rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-table-list mr-1"></i> Leads Portal
            </a>
        </div>

        <!-- Chat History -->
        <div id="chatBox" class="flex-1 p-4 overflow-y-auto chat-scroll space-y-4 bg-slate-50">
            <!-- Initial Bot Message -->
            <div class="flex items-start gap-2.5">
                <img src="https://cdn.phototourl.com/member/2026-09-27-096cc194-f699-4ff4-9178-d37994399265.png" 
                     class="w-8 h-8 rounded-full border border-slate-300 bg-white object-cover">
                <div class="bg-white border border-slate-200 text-slate-800 p-3.5 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] text-sm">
                    Salam aur Welcome! Main aapka official AI consultation agent hoon. Main aapki services ke hawalay se kya madad kar sakta hoon?
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing" class="hidden px-4 py-2 text-xs text-slate-500 italic bg-slate-50 flex items-center gap-2">
            <span class="inline-block w-2 h-2 bg-slate-400 rounded-full animate-bounce"></span>
            Agent is typing a response...
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-slate-200">
            <form id="chatForm" class="flex items-center gap-2">
                <input type="text" id="userInput" 
                       placeholder="Type your message or project requirements..." 
                       class="flex-1 bg-slate-100 text-slate-900 border border-slate-300 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900 transition" required autocomplete="off">
                <button type="submit" 
                        class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl transition duration-150 flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");
        const typing = document.getElementById("typing");
        const logoUrl = "https://cdn.phototourl.com/member/2026-09-27-096cc194-f699-4ff4-9178-d37994399265.png";

        let history = [];

        function appendMessage(text, isUser = false) {
            const div = document.createElement("div");
            div.className = isUser ? "flex justify-end" : "flex items-start gap-2.5";

            if (isUser) {
                div.innerHTML = `
                    <div class="bg-slate-900 text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm max-w-[80%] text-sm">
                        ${text}
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <img src="${logoUrl}" class="w-8 h-8 rounded-full border border-slate-300 bg-white object-cover">
                    <div class="bg-white border border-slate-200 text-slate-800 p-3.5 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] text-sm">
                        ${text}
                    </div>
                `;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, true);
            userInput.value = "";
            typing.classList.remove("hidden");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ history: history, message: message })
                });

                const data = await response.json();
                typing.classList.add("hidden");
                appendMessage(data.reply, false);

                history.push({ role: "user", content: message });
                history.push({ role: "model", content: data.reply });

            } catch (err) {
                typing.classList.add("hidden");
                appendMessage("Sorry, network issue encountered. Please try again.", false);
            }
        });
    </script>
</body>
</html>
